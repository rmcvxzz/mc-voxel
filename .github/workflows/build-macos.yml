name: Build (macOS)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install cmake ninja pkg-config sdl2 sdl2_net sdl2_image

      - name: Configure
        run: cmake -B build -G Ninja -S .

      - name: Build
        run: ninja -C build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: terram4kc-macos
          path: build/output/
          if-no-files-found: error