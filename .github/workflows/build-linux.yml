name: Build (Linux)

on:
  push:
    branches: [ main, wegademo ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libsdl2-dev \
            libsdl2-net-dev \
            libsdl2-image-dev \
            libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -G Ninja -S .

      - name: Build
        run: ninja -C build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: terram4kc-linux
          path: build/output/
          if-no-files-found: error