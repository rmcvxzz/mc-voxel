name: Build (Windows / MinGW64)

on:
  push:
    branches: [main, wegademo]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        run: cmake -B build -G Ninja -S .

      - name: Build
        run: ninja -C build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: terram4kc-windows
          path: build/output/
          if-no-files-found: error
